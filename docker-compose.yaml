name: conduit

services:
  frontend:
    build:
      context: ./conduit-frontend
      args:
        - API_URL=http://${HOST}:${PORTS_BACKEND:-8283}/api
    restart: unless-stopped
    ports: 
      - ${PORTS_FRONTEND:-8282}:80

  backend:
    build:
      context: ./conduit-backend
    restart: unless-stopped
    ports: 
      - ${PORTS_BACKEND:-8283}:80
    environment:
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ALLOWED_HOSTS: ${HOST}
      CORS_ORIGIN_WHITELIST: http://${HOST}:${PORTS_FRONTEND:-8282}
      DEBUG: ${DEBUG}
    depends_on:
      - db

  db:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql

  adminer:
    image: adminer
    restart: unless-stopped
    ports: 
      - "http://127.0.0.1:${PORTS_ADMINER:-8285}:8080"

volumes:
  db: