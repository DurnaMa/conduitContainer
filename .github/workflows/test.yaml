name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test the stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Image-Referenzen setzen
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Bei PRs: IMAGE_TAG aus PR-Head-SHA
          # Bei Push: IMAGE_TAG aus letztem commit
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_TAG=sha-${GITHUB_SHA:0:7}
          else
            IMAGE_TAG=sha-${GITHUB_SHA:0:7}
          fi
          echo "IMAGE_OWNER=$IMAGE_OWNER" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/$IMAGE_OWNER/conduit-frontend:$IMAGE_TAG" >> $GITHUB_ENV
          echo "BACKEND_IMAGE=${{ env.REGISTRY }}/$IMAGE_OWNER/conduit-backend:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Stack starten
        run: |
          cat > .env <<EOF
          POSTGRES_DB=conduit
          POSTGRES_USER=conduit
          POSTGRES_PASSWORD=test
          SECRET_KEY=test-secret
          DEBUG=False
          EOF
          docker compose up -d

      - name: Warten auf Backend
        run: |
          for i in {1..15}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8283/api/tags || true)
            echo "Versuch $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 4
          done
          docker compose logs
          exit 1

      - if: always()
        run: docker compose down -v
